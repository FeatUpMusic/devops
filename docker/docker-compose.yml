services:
  db:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: featup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # S3-compatible object storage. RustFS (Apache-2.0) replaces minio/minio, whose
  # community images are no longer published to Docker Hub or quay.io. The service
  # keeps the name "minio" because MINIO_ENDPOINT=http://minio:9000 points at it.
  # Web console: http://localhost:9001/rustfs/console/
  minio:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    command: /data
    volumes:
      - s3_data:/data

  neo4j:
    image: neo4j:community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  mongodb_data:
  neo4j_data:
  s3_data:
